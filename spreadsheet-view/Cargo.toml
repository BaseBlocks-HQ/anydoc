[package]
name = "spreadsheet-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only XLSX/CSV workbook model parser for the AnyDoc viewer, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/BaseBlocks-HQ/anydoc"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dev-dependencies]
serde_json = "1"

[dependencies]
js-sys = "0.3"
quick-xml = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
url = "2"
wasm-bindgen = "0.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
